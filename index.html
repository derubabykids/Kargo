<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>DERU baby & kids — Kargoya Veriliş Tarihi Hesaplayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:            #F8F5F2;
    --panel:         #FFFFFF;
    --panel-warm:    #F3ECE3;
    --accent-soft:   #E8D8C4;
    --accent-mid:    #C9AB9F;
    --ink:           #8B6F61;
    --ink-strong:    #6E5648;
    --white:         #FFFFFF;

    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --radius-pill: 999px;

    --shadow-soft: 0 20px 50px rgba(139,111,97,0.14), 0 2px 10px rgba(139,111,97,0.06);
    --shadow-tiny: 0 6px 16px rgba(139,111,97,0.10);

    --ease: cubic-bezier(.22,1,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(120% 100% at 50% 0%, #FBF8F5 0%, var(--bg) 55%, #F5EEE7 100%);
    color: var(--ink-strong);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: clamp(20px, 6vw, 56px) 16px 80px;
  }

  .shell{
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ============ HEADER ============ */
  .brand{
    display:flex;
    flex-direction: column;
    align-items:center;
    text-align:center;
    margin-bottom: clamp(28px, 5vw, 44px);
    animation: riseIn .7s var(--ease) both;
  }
  .brand-logo{
    width: clamp(84px, 18vw, 112px);
    height: clamp(84px, 18vw, 112px);
    border-radius: 50%;
    object-fit: cover;
    box-shadow: var(--shadow-tiny);
    margin-bottom: 18px;
    background: var(--panel-warm);
  }
  .brand-title{
    font-size: clamp(22px, 4.4vw, 30px);
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 0 0 8px;
    color: var(--ink-strong);
  }
  .brand-subtitle{
    font-size: clamp(12.5px, 2.6vw, 14.5px);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--ink);
    margin: 0;
    opacity: 0.85;
  }

  /* ============ PANEL (FORM) ============ */
  .panel{
    width: 100%;
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: clamp(22px, 5vw, 36px);
    margin-bottom: 20px;
    animation: riseIn .7s var(--ease) both;
    animation-delay: .06s;
  }

  .field{
    margin-bottom: 20px;
  }
  .field:last-child{ margin-bottom: 0; }
  .field-label{
    display:block;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-mid);
    margin-bottom: 9px;
  }
  .field-input{
    width: 100%;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 400;
    color: var(--ink-strong);
    background: var(--bg);
    border: 1.5px solid transparent;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    outline: none;
    transition: border-color .25s var(--ease), background .25s var(--ease);
  }
  .field-input::placeholder{ color: var(--accent-mid); opacity: .8; }
  .field-input:focus{
    border-color: var(--accent-mid);
    background: var(--white);
  }

  .date-row{
    display:flex;
    gap: 10px;
    align-items: stretch;
  }
  .date-row .field-input{ flex:1; min-width:0; }

  .btn-today{
    flex-shrink:0;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-strong);
    background: var(--panel-warm);
    border: 1.5px solid transparent;
    border-radius: var(--radius-md);
    padding: 0 18px;
    cursor: pointer;
    transition: background .2s var(--ease), transform .15s var(--ease), border-color .2s var(--ease);
  }
  .btn-today:hover{ background: var(--accent-soft); }
  .btn-today:active{ transform: scale(0.96); }
  .btn-today:focus-visible{ border-color: var(--ink); }

  /* ============ RESULT PANEL ============ */
  .result-panel{
    width:100%;
    background: linear-gradient(165deg, var(--panel-warm) 0%, var(--accent-soft) 100%);
    border-radius: var(--radius-lg);
    padding: clamp(22px, 5vw, 32px);
    margin-bottom: clamp(32px, 6vw, 48px);
    box-shadow: var(--shadow-soft);
    animation: riseIn .7s var(--ease) both;
    animation-delay: .12s;
  }
  .result-row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(139,111,97,0.14);
  }
  .result-row:first-child{ padding-top: 2px; }
  .result-row:last-child{ border-bottom: none; padding-bottom: 2px; }
  .result-label{
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.8;
  }
  .result-value{
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-strong);
    text-align: right;
  }
  .result-row.main{
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin: 6px 0 12px;
    border-bottom: none;
    box-shadow: var(--shadow-tiny);
  }
  .result-row.main .result-label{ opacity: 0.9; }
  .result-row.main .result-value{
    font-size: clamp(19px, 4vw, 23px);
    font-weight: 600;
    color: var(--ink-strong);
  }
  .holiday-list{
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.7;
    text-align: right;
  }

  /* ============ SECTION TITLE ============ */
  .section-title{
    width:100%;
    text-align:center;
    margin-bottom: 18px;
  }
  .section-title h2{
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-mid);
    margin: 0 0 4px;
  }
  .section-title p{
    font-size: 12px;
    color: var(--ink);
    opacity: .7;
    margin: 0;
  }

  /* ============ LIVE CARD PREVIEW ============ */
  .card-stage{
    width: 100%;
    max-width: 380px;
    animation: riseIn .7s var(--ease) both;
    animation-delay: .18s;
  }
  .preview-card{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #FEFCFA;
    border-radius: 6.5%;
    box-shadow: var(--shadow-soft);
    border: 1px solid rgba(139,111,97,0.08);
    overflow: hidden;
    display:flex;
    flex-direction: column;
    align-items: center;
    padding: 9% 10%;
  }
  .preview-card::before{
    content:'';
    position:absolute; inset:4.5%;
    border: 1px solid rgba(201,171,159,0.35);
    border-radius: 4%;
    pointer-events:none;
  }
  .preview-logo{
    width: 24%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 2%;
    margin-bottom: auto;
    box-shadow: 0 4px 14px rgba(139,111,97,0.14);
  }
  .preview-groups{
    width: 100%;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 7%;
    margin-bottom: 4%;
  }
  .preview-group{ width:100%; text-align:center; }
  .preview-group .g-label{
    display:block;
    font-size: clamp(8px, 2.7vw, 11.5px);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-mid);
    margin-bottom: 5px;
  }
  .preview-group .g-value{
    display:block;
    font-size: clamp(13px, 4.6vw, 20px);
    font-weight: 500;
    color: var(--ink-strong);
  }
  .preview-group.emphasis .g-value{
    font-size: clamp(15px, 5.6vw, 24px);
    font-weight: 700;
    color: var(--ink-strong);
    background: var(--panel-warm);
    padding: 6px 4%;
    border-radius: 10px;
    display:inline-block;
  }
  .preview-divider{
    width: 34%;
    height: 1px;
    background: var(--accent-soft);
  }

  /* ============ EXPORT BUTTON ============ */
  .export-btn{
    margin-top: 22px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--white);
    background: var(--ink-strong);
    border: none;
    border-radius: var(--radius-pill);
    padding: 15px 34px;
    cursor: pointer;
    display:inline-flex;
    align-items:center;
    gap: 10px;
    box-shadow: 0 10px 26px rgba(110,86,72,0.28);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .2s var(--ease);
  }
  .export-btn:hover{ background:#5c4838; box-shadow: 0 14px 32px rgba(110,86,72,0.34); }
  .export-btn:active{ transform: scale(0.97); }
  .export-btn:disabled{ opacity:.6; cursor: default; transform:none; }
  .export-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .export-hint{
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--ink);
    opacity: .6;
    text-align:center;
    letter-spacing: 0.02em;
  }

  .export-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top: 4px;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink-strong);
    color: var(--white);
    font-size: 13.5px;
    font-weight: 500;
    padding: 13px 22px;
    border-radius: var(--radius-pill);
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s var(--ease), transform .3s var(--ease);
    z-index: 50;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @media (max-width: 360px){
    .date-row{ flex-direction: column; }
    .btn-today{ padding: 13px 16px; }
  }
</style>
</head>

  function buildHolidayMap(){
    const map = {};
    const years = [2026,2027,2028,2029,2030,2031];
    years.forEach(y=>{
      FIXED_HOLIDAYS.forEach(([md,name])=>{ map[`${y}-${md}`] = name; });
      (RELIGIOUS_HOLIDAYS[y]||[]).forEach(([md,name])=>{ map[`${y}-${md}`] = name; });
    });
    return map;
  }
  const HOLIDAY_MAP = buildHolidayMap();

  /* ======================================================

     ====================================================== */
  const WEEKDAY_NAMES = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  function pad2(n){ return String(n).padStart(2,'0'); }

  function toISO(date){
    return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
  }

  function toTurkish(date){
    return `${pad2(date.getDate())}.${pad2(date.getMonth()+1)}.${date.getFullYear()}`;
  }

  function parseISOAsLocalDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  /* ======================================================
     15 İŞ GÜNÜ HESAPLAMA
     Kurallar: sipariş günü sayılmaz, sayım ertesi gün başlar,
     cumartesi/pazar/resmi tatil/arife sayılmaz.
     ====================================================== */
  function calculateShippingDate(orderDate, requiredBusinessDays){
    const cursor = new Date(orderDate);
    let counted = 0;
    let skippedWeekends = 0;
    const skippedHolidays = [];

    while (counted < requiredBusinessDays){
      cursor.setDate(cursor.getDate() + 1);
      const dow = cursor.getDay();
      const iso = toISO(cursor);

      if (dow === 0 || dow === 6){
        skippedWeekends++;
        continue;
      }
      if (HOLIDAY_MAP[iso]){
        skippedHolidays.push({ iso, name: HOLIDAY_MAP[iso] });
        continue;
      }
      counted++;
    }

    return {
      shipDate: new Date(cursor),
      skippedWeekends,
      skippedHolidays
    };
  }

  /* ======================================================
     DOM REFERANSLARI
     ====================================================== */
  const els = {
    customerName: document.getElementById('customerName'),
    orderDate: document.getElementById('orderDate'),
    todayBtn: document.getElementById('todayBtn'),
    resOrderDate: document.getElementById('resOrderDate'),
    resShipDate: document.getElementById('resShipDate'),
    resWeekday: document.getElementById('resWeekday'),
    resWeekends: document.getElementById('resWeekends'),
    resHolidayCount: document.getElementById('resHolidayCount'),
    resHolidayList: document.getElementById('resHolidayList'),
    previewGroups: document.getElementById('previewGroups'),
    previewLogo: document.querySelector('.preview-logo'),
    brandLogo: document.querySelector('.brand-logo'),
    exportBtn: document.getElementById('exportBtn'),
    toast: document.getElementById('toast')
  };

  const REQUIRED_BUSINESS_DAYS = 15;
  let lastState = null;

  /* ======================================================
     ANA GÜNCELLEME FONKSİYONU — canlı önizleme
     ====================================================== */
  function update(){
    const iso = els.orderDate.value;
    if (!iso) return;

    const orderDate = parseISOAsLocalDate(iso);
    const { shipDate, skippedWeekends, skippedHolidays } = calculateShippingDate(orderDate, REQUIRED_BUSINESS_DAYS);
    const customerName = els.customerName.value.trim();

    lastState = { orderDate, shipDate, customerName };

    // Sonuç paneli
    els.resOrderDate.textContent = toTurkish(orderDate);
    els.resShipDate.textContent = toTurkish(shipDate);
    els.resWeekday.textContent = WEEKDAY_NAMES[shipDate.getDay()];
    els.resWeekends.textContent = `${skippedWeekends} gün`;
    els.resHolidayCount.textContent = `${skippedHolidays.length} gün`;

    if (skippedHolidays.length){
      els.resHolidayList.textContent = skippedHolidays.map(h => `${toTurkish(parseISOAsLocalDate(h.iso))} — ${h.name}`).join(' · ');
    } else {
      els.resHolidayList.textContent = '';
    }

    renderPreviewCard(customerName, orderDate, shipDate);
  }

  function renderPreviewCard(customerName, orderDate, shipDate){
    els.previewGroups.innerHTML = '';

    const groups = [];
    if (customerName){
      groups.push({ label: 'Müşteri', value: customerName, emphasis:false });
    }
    groups.push({ label: 'Sipariş Tarihi', value: toTurkish(orderDate), emphasis:false });
    groups.push({ label: 'Kargoya Veriliş Tarihi', value: toTurkish(shipDate), emphasis:true });

    groups.forEach((g, idx) => {
      if (idx > 0){
        const divider = document.createElement('div');
        divider.className = 'preview-divider';
        els.previewGroups.appendChild(divider);
      }
      const wrap = document.createElement('div');
      wrap.className = 'preview-group' + (g.emphasis ? ' emphasis' : '');
      const label = document.createElement('span');
      label.className = 'g-label';
      label.textContent = g.label;
      const value = document.createElement('span');
      value.className = 'g-value';
      value.textContent = g.value;
      wrap.appendChild(label);
      wrap.appendChild(value);
      els.previewGroups.appendChild(wrap);
    });
  }

  /* ======================================================
     OLAY DİNLEYİCİLERİ
     ====================================================== */
  els.orderDate.addEventListener('input', update);
  els.customerName.addEventListener('input', update);
  els.todayBtn.addEventListener('click', () => {
    const now = new Date();
    els.orderDate.value = toISO(now);
    update();
  });

  /* ======================================================
     PNG OLUŞTURMA — native Canvas 2D API
     (html2canvas KULLANILMAZ; DOM ekran görüntüsüne bağımlı
     olmadığından font/scale kaymaları oluşmaz. Piksel
     hizalaması tamamen bu fonksiyon içinde kod ile belirlenir.)
     ====================================================== */
  const EXPORT_SIZE = 1080;
  const EXPORT_SCALE = 2; // retina — 2160x2160 gerçek piksel

  let logoImage = null;
  function loadLogoImage(){
    return new Promise((resolve, reject) => {
      if (logoImage){ resolve(logoImage); return; }
      const img = new Image();
      img.onload = () => { logoImage = img; resolve(img); };
      img.onerror = reject;
      img.src = LOGO_SRC;
    });
  }

  function roundedRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  async function drawCard(customerName, orderDate, shipDate){
    // Fontların tamamen yüklendiğinden emin ol
    await Promise.all([
      document.fonts.load('600 48px Poppins'),
      document.fonts.load('700 48px Poppins'),
      document.fonts.load('500 28px Poppins')
    ]);
    await document.fonts.ready;
    const logo = await loadLogoImage();

    const S = EXPORT_SIZE * EXPORT_SCALE;
    const canvas = document.createElement('canvas');
    canvas.width = S;
    canvas.height = S;
    const ctx = canvas.getContext('2d');
    const scale = S / EXPORT_SIZE; // 1080-birim koordinat sistemi -> gerçek piksel
    ctx.scale(scale, scale);

    const U = EXPORT_SIZE; // 1080 birim çalışma alanı

    // --- Arka plan ---
    const bgGrad = ctx.createLinearGradient(0, 0, U, U);
    bgGrad.addColorStop(0, '#FEFCFA');
    bgGrad.addColorStop(1, '#F8F2EC');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, U, U);

    // --- İnce iç çerçeve ---
    ctx.strokeStyle = 'rgba(201,171,159,0.38)';
    ctx.lineWidth = 1.6;
    roundedRectPath(ctx, U*0.048, U*0.048, U*0.904, U*0.904, U*0.028);
    ctx.stroke();

    // --- Logo (yeniden çizilmez, orijinal dosyadan doğrudan çizilir) ---
    const logoSize = U * 0.225;
    const logoX = (U - logoSize) / 2;
    const logoY = U * 0.115;
    ctx.save();
    ctx.beginPath();
    ctx.arc(U/2, logoY + logoSize/2, logoSize/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.shadowColor = 'rgba(139,111,97,0.22)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.clip();
    ctx.drawImage(logo, logoX, logoY, logoSize, logoSize);
    ctx.restore();

    // --- İçerik grupları (Müşteri / Sipariş Tarihi / Kargoya Veriliş Tarihi) ---
    const groups = [];
    if (customerName){
      groups.push({ label: 'MÜŞTERİ', value: customerName, emphasis:false });
    }
    groups.push({ label: 'SİPARİŞ TARİHİ', value: toTurkish(orderDate), emphasis:false });
    groups.push({ label: 'KARGOYA VERİLİŞ TARİHİ', value: toTurkish(shipDate), emphasis:true });

    const areaTop = logoY + logoSize + U*0.06;
    const areaBottom = U * 0.92;
    const areaHeight = areaBottom - areaTop;

    const groupBlockHeight = U * 0.155;
    const dividerHeight = U * 0.045;
    const totalContentHeight = groups.length * groupBlockHeight + (groups.length - 1) * dividerHeight;
    let cursorY = areaTop + Math.max(0, (areaHeight - totalContentHeight) / 2);

    ctx.textAlign = 'center';

    groups.forEach((g, idx) => {
      const centerX = U / 2;

      // Label
      ctx.fillStyle = '#C9AB9F';
      ctx.font = `500 ${U*0.0225}px Poppins, sans-serif`;
      const labelY = cursorY + U*0.032;
      drawLetterSpaced(ctx, g.label.toUpperCase(), centerX, labelY, U*0.0022);

      // Value
      const valueY = cursorY + U*0.088;
      if (g.emphasis){
        ctx.font = `700 ${U*0.044}px Poppins, sans-serif`;
        const metrics = ctx.measureText(g.value);
        const padX = U*0.035, padY = U*0.022;
        const boxW = metrics.width + padX*2;
        const boxH = U*0.066;
        ctx.fillStyle = '#F3ECE3';
        roundedRectPath(ctx, centerX - boxW/2, valueY - boxH*0.72, boxW, boxH, U*0.012);
        ctx.fill();
        ctx.fillStyle = '#6E5648';
        ctx.fillText(g.value, centerX, valueY);
      } else {
        ctx.font = `500 ${U*0.037}px Poppins, sans-serif`;
        ctx.fillStyle = '#6E5648';
        ctx.fillText(g.value, centerX, valueY);
      }

      cursorY += groupBlockHeight;

      if (idx < groups.length - 1){
        const dividerY = cursorY + dividerHeight/2;
        ctx.strokeStyle = '#E8D8C4';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(centerX - U*0.06, dividerY);
        ctx.lineTo(centerX + U*0.06, dividerY);
        ctx.stroke();
        cursorY += dividerHeight;
      }
    });

    return canvas;
  }

  // Harfler arası boşluklu (letter-spacing) metin çizimi — canvas'ta native destek olmadığından manuel uygulanır
  function drawLetterSpaced(ctx, text, centerX, y, spacing){
    const chars = text.split('');
    const widths = chars.map(c => ctx.measureText(c).width);
    const totalWidth = widths.reduce((a,b)=>a+b,0) + spacing * (chars.length - 1) * ctx.canvas.width;
    // spacing burada birim-bağımsız küçük bir katsayı; gerçek boşluğu font boyutuna göre ölçekle
    const letterGap = ctx.measureText('M').width * 0.55;
    const realTotalWidth = widths.reduce((a,b)=>a+b,0) + letterGap * (chars.length - 1);
    let x = centerX - realTotalWidth/2;
    const prevAlign = ctx.textAlign;
    ctx.textAlign = 'left';
    chars.forEach((c, i) => {
      ctx.fillText(c, x, y);
      x += widths[i] + letterGap;
    });
    ctx.textAlign = prevAlign;
  }

  async function handleExport(){
    if (!lastState) return;
    els.exportBtn.disabled = true;
    const originalLabel = els.exportBtn.innerHTML;
    els.exportBtn.innerHTML = 'Hazırlanıyor…';

    try {
      const canvas = await drawCard(lastState.customerName, lastState.orderDate, lastState.shipDate);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const fname = `deru-kargo-karti-${toISO(lastState.shipDate)}.png`;
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showToast('Kart indirildi');
    } catch (err){
      showToast('Bir sorun oluştu, tekrar deneyin');
    } finally {
      els.exportBtn.disabled = false;
      els.exportBtn.innerHTML = originalLabel;
    }
  }

  let toastTimer = null;
  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
  }

  els.exportBtn.addEventListener('click', handleExport);

  /* ======================================================
     BAŞLANGIÇ
     ====================================================== */
  function init(){
    const now = new Date();
    els.orderDate.value = toISO(now);
    els.orderDate.min = '2026-01-01';
    els.orderDate.max = '2031-12-31';
    update();
  }
  init();

})();
</script>
</body>
